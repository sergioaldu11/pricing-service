server.port=8080

spring.datasource.url=jdbc:h2:mem:pricesdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

spring.application.name=pricing-service
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
pricing.security.enabled=${PRICING_SECURITY_ENABLED:false}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${PRICING_SECURITY_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.audiences=${PRICING_SECURITY_AUDIENCE:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
